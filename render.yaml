services:
  - type: web
    name: interview-trainer-backend
    runtime: python
    rootDir: backend
    # sentence-transformers only needed to rebuild embeddings.json locally.
    # At runtime the server only needs numpy (already in requirements.txt).
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_MODEL_ID
        sync: false
      - key: WATSONX_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    plan: free
